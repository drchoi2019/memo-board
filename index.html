<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Memo Board</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preload" href="fonts/RIDIBatang.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="style.css?v=5">
<script>try {
  const r = document.documentElement, ls = localStorage;
  if (ls.getItem('mb_theme') === 'dark') r.dataset.theme = 'dark';
  if (ls.getItem('mb_fs')) r.style.setProperty('--fs', ls.getItem('mb_fs') + 'px');
  if (ls.getItem('mb_lh')) r.style.setProperty('--lh', ls.getItem('mb_lh'));
  if (ls.getItem('mb_w')) r.style.setProperty('--w', ls.getItem('mb_w') + 'px');
} catch {}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<header class="top">
  <a class="navlink" href="#/">Posts</a>
  <nav>
    <a id="newBtn" class="icon" href="#/new" title="New post" aria-label="New post" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
    <button class="icon" type="button" data-k="mb_fs" data-dir="-1" title="Smaller text" aria-label="Smaller text"><span class="aa">A−</span></button>
    <button class="icon" type="button" data-k="mb_fs" data-dir="1" title="Larger text" aria-label="Larger text"><span class="aa">A+</span></button>
    <button id="themeBtn" class="icon" type="button"></button>
    <a class="icon" href="#/settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
  </nav>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="toast" hidden></div>
<script src="app.js?v=5"></script>
</body>
</html>
